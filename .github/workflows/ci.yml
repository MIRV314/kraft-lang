name: check

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: LuaJIT
        run: |
          sudo apt-get update
          sudo apt-get install -y luajit

      - name: Tests
        run: make check

      - name: Чистая копия без кеша
        run: |
          rm -f xkraft.lua
          ./xkraft --version
          ./xkraft examples/hello.kraft
          ./xkraft examples/features.kraft

      - name: Дистрибутив
        run: |
          make dist
          git diff --exit-code -- dist
          dist/xkraft --version
          dist/xkraft examples/features.kraft >/dev/null

      - name: Установка
        run: |
          repo=$PWD
          KRAFT_HOME="$RUNNER_TEMP/kraft-home" KRAFT_BIN="$RUNNER_TEMP/kraft-bin" sh install.sh
          "$RUNNER_TEMP/kraft-bin/xkraft" --version
          (cd "$RUNNER_TEMP" && "$RUNNER_TEMP/kraft-bin/xkraft" "$repo/examples/features.kraft" >/dev/null)
          KRAFT_SRC="$PWD" KRAFT_PREFIX="$RUNNER_TEMP/kraft-auto" sh install-auto.sh
          "$RUNNER_TEMP/kraft-auto/bin/xkraft" --version
          (cd "$RUNNER_TEMP" && "$RUNNER_TEMP/kraft-auto/bin/xkraft" "$repo/examples/features.kraft" >/dev/null)
